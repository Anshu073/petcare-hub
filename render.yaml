services:
  - type: web
    name: petcare-hub
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn petcare.wsgi"
    envVars:                      # NEW
      - key: PYTHON_VERSION       # NEW
        value: 3.12.11 