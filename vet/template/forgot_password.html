<!doctype html>
{% load static %}
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Forgot Password - Petpal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaina+2:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}">
    
    <style>
        :root { --tg-brand-color: #894B8D; --tg-brand-light: #f4eef5; }
        
        body {
            background: radial-gradient(circle, #fcfaff 0%, #f4eef5 100%);
            background-image: url("https://www.transparenttextures.com/patterns/paws.png");
            font-family: 'Baloo Bhaina 2', cursive;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .forgot-card {
            background: #ffffff;
            border-radius: 40px;
            border: 6px solid var(--tg-brand-color);
            padding: 50px 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0px 30px 60px rgba(137, 75, 141, 0.15);
            position: relative;
        }

        .form-grp input {
            width: 100%;
            padding: 18px 25px;
            border-radius: 20px;
            border: 2px solid #e8dae9;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: 0.3s;
        }

        .form-grp input:focus {
            border-color: var(--tg-brand-color);
            box-shadow: 0 10px 25px rgba(137, 75, 141, 0.1);
            outline: none;
        }

        .btn-brand {
            background-color: var(--tg-brand-color);
            color: #fff;
            border: none;
            border-radius: 18px;
            padding: 18px;
            font-weight: 700;
            width: 100%;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-brand:hover { transform: translateY(-3px); background: #6a3a6d; }

        .back-link { color: var(--tg-brand-color); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
    <div class="forgot-card text-center">
        <h2 class="mb-3">Forgot Password?</h2>
        <p class="mb-4 text-muted" style="font-family: 'Plus Jakarta Sans';">Enter your email and we'll send you a link to reset your treats!</p>


        <form action="{% url 'vet_forgot_password' %}" method="POST">
            {% csrf_token %}
            <div class="form-grp mb-4">
                <input type="email" name="email" placeholder="Enter Registered Email" required>
            </div>
            <button type="submit" class="btn-brand">Send Reset Link 🐾</button>
        </form>

        <div class="mt-4">
            <a href="{% url 'vet_login' %}" class="back-link">← Back to Login</a>
        </div>
    </div>
</body>
</html>
