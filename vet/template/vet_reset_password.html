<!doctype html>
{% load static %}
<html class="no-js" lang="en">
<head>
    <meta charset="utf-8">
    <title>Reset Password - Petpal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/fontawesome-all.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/main.css' %}">

    <style>
        :root { --tg-brand-color: #894B8D; --tg-brand-light: #f4eef5; }
        body { background-color: var(--tg-brand-light); font-family: 'Baloo Bhaina 2', cursive; }
        .forgot-wrapper { padding: 80px 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .forgot-card { background: #ffffff; border-radius: 40px; border: 6px solid var(--tg-brand-color); padding: 50px 40px; width: 100%; max-width: 480px; box-shadow: 0px 30px 60px rgba(137, 75, 141, 0.1); }
        .form-grp { margin-bottom: 20px; }
        .form-grp input { width: 100%; padding: 16px 20px; border-radius: 15px; border: 2px solid #f0f0f0; background: #fafafa; }
        .btn-brand { background-color: var(--tg-brand-color); color: #fff; border: none; border-radius: 15px; padding: 18px; font-weight: 700; width: 100%; text-transform: uppercase; cursor: pointer; }
    </style>
</head>
<body>
    <div class="forgot-wrapper">
        <div class="forgot-card">
            <div class="text-center mb-4">
                <h2 style="font-weight: 800; color: #333;">Reset Password</h2>
                <p style="color: #666; font-size: 14px;">Enter the 5-digit code sent to your email and choose a new password.</p>
            </div>


            <form action="{% url 'vet_reset_password' %}" method="POST">
                {% csrf_token %}
                <div class="form-grp">
                    <input type="text" name="otp" placeholder="Enter 5-Digit OTP" required maxlength="5">
                </div>
                <div class="form-grp">
                    <input type="password" name="password" placeholder="New Password" required>
                </div>
                <div class="form-grp">
                    <input type="password" name="confirm-password" placeholder="Confirm New Password" required>
                </div>

                <button type="submit" class="btn-brand">Update Password 🐾</button>
            </form>
        </div>
    </div>
</body>
</html>
