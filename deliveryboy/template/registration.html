{% load static %}

{% block content %}
<head>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/fontawesome-all.min.css' %}">

    <style>
        /* 1. Global Background Setup */
        body {
            background-color: #f7eff7 !important; /* Soft lavender tint */
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* 2. Fixed Background Doodles with High Transparency */
        .fixed-doodles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .doodle-left {
            position: absolute;
            bottom: 0;
            left: -30px;
            width: 38%;
            opacity: 0.12; /* Transparency fixed as per screenshot */
        }

        .doodle-right {
            position: absolute;
            top: 40px;
            right: -20px;
            width: 32%;
            opacity: 0.08; /* Right side extra faded */
        }

        .paw-icon {
            position: absolute;
            filter: opacity(0.05); /* Very subtle paws */
            width: 50px;
        }

        /* 3. Premium Card Design */
        .premium-card {
            background: #ffffff;
            border: 6px solid #894B8D !important; /* Thick brand border */
            border-radius: 50px !important;
            box-shadow: 0 30px 60px rgba(137, 75, 141, 0.12);
            padding: 60px 50px !important;
            margin-top: 20px;
        }

        /* 4. Headings inside Card */
        .join-text {
            color: #894B8D;
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: block;
            margin-bottom: 8px;
            text-align: center;
        }

        .main-title {
            font-size: 34px;
            font-weight: 800;
            color: #1a202c;
            margin-bottom: 40px;
            text-align: center;
        }

        /* 5. Input Styling (Screenshot Blue Tint) */
        .custom-input {
            background-color: #f0f5ff !important; /* Soft blue background */
            border: 1px solid #e2e8f0 !important;
            border-radius: 18px !important;
            height: 60px !important;
            padding: 0 25px !important;
            font-size: 16px !important;
            transition: 0.3s;
        }

        .custom-input:focus {
            background-color: #fff !important;
            border-color: #894B8D !important;
            box-shadow: 0 0 0 4px rgba(137, 75, 141, 0.1) !important;
        }

        .form-label {
            font-weight: 700 !important;
            color: #4a5568 !important;
            margin-bottom: 10px;
            margin-left: 5px;
        }

        /* 6. Button */
        .btn-register {
            background-color: #894B8D !important;
            color: white !important;
            border-radius: 50px !important;
            font-weight: 800 !important;
            padding: 18px !important;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            width: 100%;
            margin-top: 25px;
            transition: 0.3s;
        }

        .btn-register:hover {
            background-color: #4b2c4d !important;
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(137, 75, 141, 0.25) !important;
        }
    </style>
</head>

<div class="fixed-doodles">
    <img src="{% static 'assets/img/banner/banner_img01.png' %}" class="doodle-left">
    <img src="{% static 'assets/img/images/about_img.png' %}" class="doodle-right">
    <img src="{% static 'assets/img/icon/pet_icon02.svg' %}" class="paw-icon" style="top: 15%; left: 8%;">
    <img src="{% static 'assets/img/icon/pet_icon01.svg' %}" class="paw-icon" style="bottom: 20%; right: 12%;">
</div>

<main class="py-5 d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-9">
                
                <div class="premium-card">
                    <span class="join-text">DELIVERY BOY REGISTRATION</span>
                    <h1 class="main-title">Create Account</h1>

                    <form action="{% url 'delivery_register' %}" method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="row">
                            <div class="col-12 mb-3">
                                <label class="form-label">Linked Vendor / Pet Shop</label>
                                <select name="vendor_id" class="form-select custom-input" required>
                                    <option value="" selected disabled>Select your store...</option>
                                    {% for v in vendors %}
                                        <option value="{{ v.vendor_id }}">{{ v.vendor_name }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" name="deliveryboy_name" class="form-control custom-input" placeholder="Enter Full Name" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Mobile Number</label>
                                <input type="tel" name="contact" class="form-control custom-input" placeholder="10-digit number" required>
                            </div>

                            <div class="col-12 mb-3">
                                <label class="form-label">Email Address</label>
                                <input type="email" name="email" class="form-control custom-input" placeholder="" required>
                            </div>

                            <div class="col-12 mb-4">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control custom-input" placeholder="" required>
                            </div>
                            <div class="col-12 mb-4">
    <label class="form-label fw-bold small ms-2">Upload Profile Photo</label>
    <input type="file" name="deliveryboy_profile" class="form-control custom-input pt-3" accept="image/*">
    <small class="text-muted ms-2">Photo will be saved in your personal media folder.</small>
</div>
                        </div>

                        <button type="submit" class="btn-register shadow-sm">
                            REGISTER AS DELIVERY BOY 🐾
                        </button>

                        <div class="text-center mt-4 pt-3 border-top">
                            <p class="text-muted small">Already a partner? 
                                <a href="{% url 'delivery_login' %}" class="fw-bold text-decoration-none" style="color: #894B8D;">Login to Dashboard</a>
                            </p>
                        </div>
                    </form>
                </div>
                </div>
        </div>
    </div>
</main>
{% endblock %}
