<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>PetCareHub - All in one hub for all your furry friends</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'assets/img/petcarehub_roundlogo_bgremoved.png' %}">
  <!-- General CSS Files -->
  <link rel="stylesheet" href="{% static 'assets/css/app.min.css' %}">
  <!-- Template CSS -->
  <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/components.css' %}">
  <!-- Custom style CSS -->
  <style>
/* - Main Card Styling */
.card-auth {
    background: rgba(255, 255, 255, 0.95) !important;
    border-radius: 40px !important;
    border: none !important;
    box-shadow: 0 20px 40px rgba(137, 75, 141, 0.25) !important;
    overflow: hidden;
}

/* - White Header with Capsule Text */
.card-header-auth {
    background: #ffffff !important; /* Peeche se purple nikal diya */
    padding: 35px 20px 15px 20px !important;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    border-bottom: none !important;
}

.card-header-auth h4 {
    /* Logo ka exact purple shade */
    background-color: #894B8D !important; 
    color: #ffffff !important;
    padding: 12px 35px !important;
    border-radius: 50px !important; /* Capsule shape */
    font-weight: 800 !important;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin: 0 !important;
    font-size: 16px !important;
    box-shadow: 0 6px 15px rgba(137, 75, 141, 0.2) !important;
}

/* - Button Same as Login */
.btn-auth-color {
    background-color: #894B8D !important; /* Logo Purple */
    color: white !important;
    border: none !important;
    border-radius: 15px !important;
    padding: 15px !important;
    font-weight: 700 !important;
    text-transform: uppercase;
    width: 100%;
    transition: 0.3s ease;
}

/* - Hover Effect (Light Purple) */
.btn-auth-color:hover {
    background-color: #a46ca8 !important; 
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(137, 75, 141, 0.3) !important;
}

/* Logo Brand Styling */
.login-brand {
    display: inline-block;
    padding: 0 !important; 
    border: 5px solid #b294b5 !important; 
    border-radius: 60px !important; 
    width: 380px !important; 
    height: 110px !important;
    margin-bottom: 30px !important;
    background: #fff;
    overflow: hidden; 
    box-shadow: 0 10px 25px rgba(137, 75, 141, 0.2) !important;
}
</style>
  <!-- <link rel='shortcut icon' type='image/x-icon' href="{% static 'assets/img/favicon.ico' %}" /> -->
</head>

<body style="background-image: url('{% static 'assets/img/admin_background.png' %}'); background-size: cover; background-repeat: no-repeat; background-attachment: fixed; background-position: center;">
  <div class="loader"></div>
  <div id="app">
    <section class="section">
      <div class="container mt-5">
        <div class="row">
          <div class="col-12 col-sm-8 offset-sm-2 col-md-6 offset-md-3 col-lg-6 offset-lg-3 col-xl-4 offset-xl-4">
            <div class="login-brand login-brand-color">
              <img alt="image" src="{% static 'assets/img/logo2.png' %}" style="height:100px;width:320px;" />
              
            </div>
            <div class="card card-auth">
              <div class="card-header card-header-auth">
                <h4>Forgot Password</h4>
              </div>
              <!-- <center>
              <div class="logo-auth">
              	<img alt="image" src="{% static 'assets/img/logo.png' %}" />
          	  </div>
          	  <div>
          	  	<span class="logo-name-auth">Grexsan</span>
          	  </div>
          	  </center> -->
              <div class="card-body">
                <p class="text-muted">We will send a link to reset your password</p>
                <form method="POST" action="{% url 'forgotpass' %}">
                  {% csrf_token %}
                  <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" type="email" class="form-control" name="email" required autofocus>
                  </div>
                  <div class="form-group">
                    <button type="submit" class="btn btn-lg btn-block btn-auth-color">
                      Send OTP
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <!-- General JS Scripts -->
  <script src="{% static 'assets/js/app.min.js' %}"></script>
  <!-- JS Libraies -->
  <!-- Page Specific JS File -->
  <!-- Template JS File -->
  <script src="{% static 'assets/js/scripts.js' %}"></script>

</body>
