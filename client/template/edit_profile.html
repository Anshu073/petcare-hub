{% extends 'header1.html' %}
{% load static %}
{% block content %}

<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 card border-0 shadow-lg rounded-4 p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold m-0" style="color: #894B8D;">
            <i class="fas fa-user-edit me-2"></i> Edit Profile
        </h3>
        <a href="{% url 'home' %}" class="text-decoration-none small fw-bold" style="color: #894B8D;">
            <i class="fas fa-arrow-left me-1"></i> Back to Home
        </a>
    </div>
    
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="row align-items-center mb-5 p-3 rounded-4" style="background-color: #fcf8ff;">
            <div class="col-md-3 text-center">
                <div class="position-relative d-inline-block">
                    <img id="profile-preview" 
                         src="{% if customer.user_profile %}{{ customer.user_profile.url }}{% else %}{% static 'assets/img/users/default.png' %}{% endif %}" 
                         class="rounded-circle border border-3 shadow" 
                         style="width: 140px; height: 140px; object-fit: cover; border-color: #894B8D !important; transition: opacity 0.3s ease;">
                    
                    <input type="file" name="profile_pic" id="profile-file-input" class="d-none" accept="image/*">
                </div>
            </div>
            
            <div class="col-md-9 gap-2">
                <h5 class="fw-bold mb-2">Profile Picture</h5>
                <div id="photo-action-buttons" class="d-flex flex-wrap gap-2 mt-2">
                    <button type="button" id="change-photo-btn" class="btn btn-sm btn-primary rounded-pill px-4" onclick="document.getElementById('profile-file-input').click()" style="background-color: #894B8D; border: none;">
    <i class="fas fa-upload me-1"></i> 
    <span id="btn-text">{% if customer.user_profile %}Change Photo{% else %}Choose Photo{% endif %}</span>
</button>
                    
                    <button type="button" id="remove-photo-btn" class="btn btn-sm btn-outline-danger rounded-pill px-4" onclick="removePhoto()" style="{% if not customer.user_profile %}display: none;{% endif %}">
                        <i class="fas fa-trash-alt me-1"></i> Remove
                    </button>
                </div>
                <p class="small text-muted mt-2 mb-0">* Allowed formats: JPG, PNG, JPEG. Max size 2MB.</p>
            </div>
            
            <input type="hidden" name="remove_photo_flag" id="remove-photo-flag" value="0">
        </div>

        <div class="row g-3">
            <div class="col-md-6">
                <label class="small fw-bold mb-1">Full Name</label>
                <input type="text" name="name" value="{{ customer.cust_name }}" class="form-control rounded-pill px-3" required>
            </div>
            <div class="col-md-6">
                <label class="small fw-bold mb-1">Contact Number</label>
                <input type="text" name="contact" value="{{ customer.contact }}" class="form-control rounded-pill px-3" required maxlength="10">
            </div>
            <div class="col-12">
                <label class="small fw-bold mb-1">Residential Address</label>
                <textarea name="address" class="form-control rounded-4 px-3" rows="3" required>{{ customer.address }}</textarea>
            </div>
        </div>

        <div class="mt-5 border-top pt-4 text-end">
            <a href="{% url 'home' %}" class="btn btn-light rounded-pill px-4 me-2">Cancel</a>
            <button type="submit" class="btn btn-primary rounded-pill px-5 fw-bold" style="background: #894B8D; border: none;">
                Save Changes 🐾
            </button>
        </div>
    </form>
</div>
    </div>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Elements Selection
        const fileInput = document.getElementById('profile-file-input');
        const previewImg = document.getElementById('profile-preview');
        const flagInput = document.getElementById('remove-photo-flag');
        const removeBtn = document.getElementById('remove-photo-btn');
        
        // Target specifically the text span to avoid overlap
        const btnTextSpan = document.getElementById('btn-text'); 
        
        // Static default path
        const staticDefaultUrl = "{% static 'assets/img/users/default.png' %}"; 

        // 1. Photo Selection Logic
        fileInput.addEventListener("change", function(event) {
            const file = event.target.files[0];
            if (file) {
                flagInput.value = "0"; // Reset remove flag
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.src = e.target.result; // Update preview
                    previewImg.style.opacity = "1";
                    
                    // Overlap Fix: Clear old text and set only "Change Photo"
                    btnTextSpan.innerText = "Change Photo";
                    
                    // Show remove button if a file is picked
                    if (removeBtn) removeBtn.style.display = "inline-flex"; 
                }
                reader.readAsDataURL(file);
            }
        });

        // 2. Photo Removal Logic
        window.removePhoto = function() {
            if(confirm("Are you sure you want to remove your profile photo?")) {
                previewImg.style.opacity = "0.5"; 
                
                setTimeout(() => {
                    previewImg.src = staticDefaultUrl; // Revert to default.png
                    flagInput.value = "1"; // Signal backend to clear user_profile
                    fileInput.value = ""; // Clear file input
                    
                    // Reset Button UI
                    btnTextSpan.innerText = "Choose Photo";
                    if (removeBtn) removeBtn.style.display = "none";
                    
                    previewImg.style.opacity = "1";
                }, 300);
            }
        }
    });
</script>
{% endblock %}
